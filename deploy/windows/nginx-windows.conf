# ============================================================
# 业务安全态势系统 - Windows 原生部署 nginx 配置
# 用法：把本文件内容整体替换到 nginx 安装目录 conf\nginx.conf
#      （与 conf\mime.types 同目录，include 可正常解析）
# 启动：start nginx   （在 nginx 安装目录执行）
# 停止：nginx -s stop
# ============================================================

worker_processes  1;

# Windows 上 PID 文件相对 nginx 前缀目录（nginx.exe 所在目录）解析
pid logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 演示机本地跑，sendfile 关闭更稳妥（Windows 下 sendfile 有限制）
    sendfile        off;
    keepalive_timeout  65;
    charset         utf-8;

    # 访问日志写到 nginx 安装目录的 logs 下
    access_log      logs/access.log;
    error_log       logs/error.log;

    server {
        # 访问入口端口；若 80 空闲想直接用 80，改成 80 即可
        listen       8081;
        server_name  localhost;

        # ==========================================================
        # 前端构建产物目录（重要：按实际路径修改，Windows 用正斜杠）
        # 离线包布局:  C:/bss/dist-offline-win64/frontend/dist
        # 仓库布局:    <仓库>/frontend/dist
        # ==========================================================
        root  C:/bss/dist-offline-win64/frontend/dist;
        index index.html;

        # SPA 路由回退：刷新 /overview、/security 等深链时返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反向代理（同源 /api，保证 JSESSIONID 会话稳定）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 健康检查透传
        location /actuator/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
